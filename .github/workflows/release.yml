name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the plugin.json version if it has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
